services:
  reddit-analysis:
    build: .
    container_name: reddit-analysis
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: reddit-data
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    depends_on:
      - minio
    stdin_open: true
    tty: true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    container_name: reddit-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
